  text-decoration-line: line-through;
}

.outline-none {
  outline: 2px solid transparent;
  outline-offset: 2px;
}

.outline {
  outline-style: solid;
}

.blur {
  --tw-blur: blur(8px);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.filter {
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

:root{
  --surface:#F6F7FB;
  --card:#FFFFFF;
  --ink:#111827;
  --muted:#6B7280;
  --line:#E5E7EB;
  --swing-bar:#FFFFFF;
  --swing-panel:#F6F7FB;
  --swing-btn:#F3F4F6;
  --swing-border:#E5E7EB;
  --swing-table:#E5E7EB;
  --primary:#4F46E5;
  --success:#16A34A;
  --danger:#DC2626;
  --selected:#F59E0B;
}

@media (prefers-color-scheme: dark){
  :root{
    --surface:#111827;
    --card:#1F2937;
    --ink:#F9FAFB;
    --muted:#9CA3AF;
    --line:#374151;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--surface);
  color:var(--ink);
  font-family:Arial,Helvetica,SansSerif;
}

button, input, select{
  font-family:Arial,Helvetica,SansSerif
}

.no-round{
  border-radius:0 !important
}

.swing-frame{
  box-shadow:none !important
}

@media (min-width: 640px) {
  .sm\:col-span-2 {
    grid-column: span 2 / span 2;
  }

  .sm\:inline {
    display: inline;
  }

  .sm\:w-\[180px\] {
    width: 180px;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:flex-row {
    flex-direction: row;
  }

  .sm\:p-4 {
    padding: 1rem;
  }

  .sm\:p-5 {
    padding: 1.25rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:text-sm {
    font-size: 0.875rem;
    line-height: 1.25rem;
  }

  .sm\:text-xl {
    font-size: 1.25rem;
    line-height: 1.75rem;
  }
}

@media (min-width: 768px) {
  .md\:flex {
    display: flex;
  }

  .md\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
  .lg\:sticky {
    position: sticky;
  }

  .lg\:top-\[104px\] {
    top: 104px;
  }

  .lg\:w-\[248px\] {
    width: 248px;
  }

  .lg\:flex-row {
    flex-direction: row;
  }

  .lg\:self-start {
    align-self: flex-start;
  }
}
